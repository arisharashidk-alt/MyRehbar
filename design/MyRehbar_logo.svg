<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- The Lift: the larger chevron (the Rehbar) carries the smaller one (the student) upward -->
    <g id="lift" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
      <path d="M18 100 L60 58 L102 100" stroke="#1F7A5C"/>
      <path d="M36 48 L60 24 L84 48" stroke="#3EB489"/>
    </g>
    <g id="lift-dark" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
      <path d="M18 100 L60 58 L102 100" stroke="#FFFFFF"/>
      <path d="M36 48 L60 24 L84 48" stroke="#3EB489"/>
    </g>
  </defs>

  <rect width="1200" height="640" fill="#FAFCFB"/>
  <text x="60" y="70" font-size="28" font-weight="700" fill="#1B2623">MyRehbar logo · The Lift</text>
  <text x="60" y="100" font-size="15" fill="#5A6B65">The larger shape is the Rehbar, the smaller one is the student, and together they point upward.</text>

  <!-- Primary horizontal lockup -->
  <rect x="60" y="130" width="640" height="220" rx="20" fill="#FFFFFF" stroke="#E2EAE6"/>
  <use href="#lift" transform="translate(110,180)"/>
  <text x="250" y="262" font-size="56" font-weight="700" fill="#0F3D2E" letter-spacing="-1">My<tspan fill="#1F7A5C">Rehbar</tspan></text>
  <text x="252" y="296" font-size="17" fill="#5A6B65">Your guide to what's possible.</text>
  <text x="84" y="334" font-size="12" font-weight="700" fill="#5A6B65" letter-spacing="1.2">PRIMARY · LIGHT</text>

  <!-- Dark lockup -->
  <rect x="730" y="130" width="410" height="220" rx="20" fill="#0F3D2E"/>
  <use href="#lift-dark" transform="translate(770,180) scale(0.8)"/>
  <text x="880" y="252" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1">My<tspan fill="#CDEFE0">Rehbar</tspan></text>
  <text x="754" y="334" font-size="12" font-weight="700" fill="#CDEFE0" letter-spacing="1.2">ON DARK</text>

  <!-- App icon / favicon -->
  <rect x="60" y="380" width="1080" height="220" rx="20" fill="#FFFFFF" stroke="#E2EAE6"/>
  <text x="84" y="584" font-size="12" font-weight="700" fill="#5A6B65" letter-spacing="1.2">APP ICON · FAVICON · SIZES</text>

  <rect x="100" y="410" width="140" height="140" rx="32" fill="#EEF8F3"/>
  <use href="#lift" transform="translate(110,420)"/>

  <rect x="280" y="410" width="140" height="140" rx="32" fill="#0F3D2E"/>
  <use href="#lift-dark" transform="translate(290,420)"/>

  <rect x="460" y="410" width="140" height="140" rx="70" fill="#3EB489"/>
  <g transform="translate(470,420)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
    <path d="M18 100 L60 58 L102 100" stroke="#0F3D2E"/>
    <path d="M36 48 L60 24 L84 48" stroke="#FFFFFF"/>
  </g>

  <use href="#lift" transform="translate(660,440) scale(0.6)"/>
  <use href="#lift" transform="translate(760,455) scale(0.4)"/>
  <use href="#lift" transform="translate(830,465) scale(0.27)"/>
  <use href="#lift" transform="translate(880,470) scale(0.18)"/>
  <text x="660" y="540" font-size="12" fill="#5A6B65">72px · 48px · 32px · 22px</text>
</svg>
