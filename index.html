<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F3D2E" />

    <!-- Default SEO tags. Each page updates title/description at runtime (src/hooks/usePageMeta.ts). -->
    <title>MyRehbar · Your guide to what's possible</title>
    <meta name="description" content="Free mentors (Rehbars) and scholarship guidance for students in Pakistan. Nobody should rule themselves out because no one told them funding exists." />
    <link rel="canonical" href="https://myrehbar.org/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyRehbar" />
    <meta property="og:title" content="MyRehbar · Your guide to what's possible" />
    <meta property="og:description" content="Free mentors and scholarship guidance for students in Pakistan." />
    <meta property="og:url" content="https://myrehbar.org/" />
    <meta property="og:image" content="https://myrehbar.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyRehbar · Your guide to what's possible" />
    <meta name="twitter:description" content="Free mentors and scholarship guidance for students in Pakistan." />
    <meta name="twitter:image" content="https://myrehbar.org/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- One English font (Inter, 3 weights). The Urdu font loads only when someone switches to Urdu. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>MyRehbar needs JavaScript to run. Please turn it on, or open this page in another browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
